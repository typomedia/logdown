<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{block "title" .}}{{.App.Name}}{{end}}</title>
    {{block "stylesheets" .}}
        <link rel="stylesheet" href="/themes/zuse/libs/bootstrap/css/bootstrap.css">
        <link rel="stylesheet" href="/themes/zuse/styles.css">
    {{end}}
</head>
<body class="{{.Route}}">
<header>
    <nav class="navbar">
        <div class="container-fluid">
            <div class="navbar-header">
                <a class="navbar-brand" href="/"><span class="fa fa-wpexplorer"></span>&ensp;{{.App.Name}}</a>
            </div>
            <form class="navbar-form navbar-right" method="get" action="/">
                <div class="form-group">
                    <label>
                        <input type="text" name="search" class="form-control" value="" autofocus="autofocus" placeholder="Search...">
                    </label>
                </div>
                <button type="submit" class="btn btn-default"><span class="fa fa-search"></span></button>
            </form>
            <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
                <ul class="nav navbar-nav">
                    <li class="{{if hasPrefix .Route "logs"}}active{{end}}">
                        <a href="/"><span class="fa fa-bullseye"></span> Requests</a>
                    </li>
                    <li class="{{if hasPrefix .Route "app_upload"}}active{{end}}">
                        <a href="/upload/"><span class="fa fa-upload"></span> Upload</a>
                    </li>
                    <li class="{{if hasPrefix .Route "app_about"}}active{{end}}">
                        <a href="/about/"><span class="fa fa-info-circle"></span> About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
<section>
    {{block "body" .}}{{end}}
</section>
<footer>
    <div>
        <span>&copy; {{.Year}} Typomedia Foundation. <span class="hidden-xs">Developed with <i class="love">&hearts;</i> by Philipp Speck.</span></span>
        <span class="pull-right">Version {{.App.Version}}</span>
    </div>
</footer>
{{block "javascripts" .}}
    <script src="/themes/zuse/libs/jquery/jquery.slim.min.js"></script>
    <script src="/themes/zuse/libs/jquery/plugins/tablesorter.min.js"></script>
    <script>
        $('table.table').tablesorter();
    </script>
{{end}}
</body>
</html>
