{{define "body"}}
    <section class="container-fluid">
        <div class="container">
            <div class="row" style="margin-top: 20px">
                <div class="col-md-12">
ke                    Drag&Drop your IIS log files here. Each time you upload new files the database will be rebuilt.
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Click or drop log files to upload">
                        <div>
                            <i class="fa fa-folder-open-o"></i>
                            <p>Open</p>
                        </div>
                    </div>
                    <input id="file-input" type="file" multiple style="display:none">
                </div>
                <div id="upload-status" style="display:none; text-align:center; margin-top: 20px;">
                    <i class="fa fa-spinner fa-spin fa-3x"></i>
                    <p id="upload-status-text" style="margin-top: 10px;">Uploading…</p>
                </div>
            </div>
        </div>
    </section>
{{end}}
{{define "javascripts"}}
    <script>
        (function () {
            var dz = document.getElementById('dropzone');
            var input = document.getElementById('file-input');
            var status = document.getElementById('upload-status');
            var text = document.getElementById('upload-status-text');

            function stop(e) { e.preventDefault(); e.stopPropagation(); }

            ['dragenter', 'dragover'].forEach(function (name) {
                dz.addEventListener(name, function (e) {
                    stop(e);
                    dz.classList.add('dz-drag-hover');
                });
            });
            ['dragleave', 'drop'].forEach(function (name) {
                dz.addEventListener(name, function (e) {
                    stop(e);
                    dz.classList.remove('dz-drag-hover');
                });
            });

            dz.addEventListener('drop', function (e) { upload(e.dataTransfer.files); });
            dz.addEventListener('click', function () { input.click(); });
            dz.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') { stop(e); input.click(); }
            });
            input.addEventListener('change', function () { upload(input.files); });

            function upload(files) {
                if (!files || files.length === 0) return;

                var form = new FormData();
                for (var i = 0; i < files.length; i++) {
                    form.append('files', files[i], files[i].name);
                }
                text.textContent = 'Uploading…';
                status.style.display = 'block';

                var xhr = new XMLHttpRequest();
                xhr.open('POST', '/upload/upload');
                xhr.upload.addEventListener('progress', function (e) {
                    if (e.lengthComputable && e.loaded >= e.total) {
                        text.textContent = 'Importing into database…';
                    }
                });
                xhr.addEventListener('load', function () {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        window.location = '/';
                    } else {
                        text.textContent = 'Upload failed (' + xhr.status + ').';
                    }
                });
                xhr.addEventListener('error', function () {
                    text.textContent = 'Upload failed.';
                });
                xhr.send(form);
            }
        })();
    </script>
{{end}}
