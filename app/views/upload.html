{{define "body"}}
    <section class="container-fluid">
        <div class="container">
            <div class="row" style="margin-top: 20px">
                <div class="col-md-12">
                    Drag&Drop your IIS log files here. Each time you upload new files the database will be rebuilt. Maximum <strong>40</strong> parallel uploads are allowed at once!
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <form action="/upload/upload" enctype="multipart/form-data" class="dropzone" id="dropzone">
                        <div>
                            <i class="fa fa-folder-open-o"></i>
                        </div>
                    </form>
                </div>
                <h1 id="filename"></h1>
            </div>
        </div>
    </section>
{{end}}
{{define "javascripts"}}
    <script src="/themes/zuse/libs/jquery/jquery.slim.min.js"></script>
    <script src="/themes/zuse/libs/jquery/plugins/tablesorter.min.js"></script>
    <script>
        $('table.table').tablesorter();
    </script>
    <script src="/themes/zuse/libs/dropzone/dropzone.js"></script>
    <link rel="stylesheet" href="/themes/zuse/libs/dropzone/dropzone.min.css"/>
    <script>
        Dropzone.options.dropzone = {
            autoProcessQueue: true,
            uploadMultiple: true,
            parallelUploads: 40,
            dictDefaultMessage: 'Open',
            success: function(file, response) {
                console.log(response.files);
                window.location = "/";
            },
        };
    </script>
{{end}}
